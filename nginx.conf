server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Serve static assets directly (returns 404 if missing, preventing infinite loops)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|map|json)$ {
        try_files $uri =404;
    }

    # SPA Routing (redirects all client routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

     # implementation of health
     location /health {
        access_log off;
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"up"}';
      }
}
