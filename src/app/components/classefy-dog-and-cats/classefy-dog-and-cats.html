<div class="m-lg-3">
  <p class="h2">Dog & Cat Classifier</p>
  <form [formGroup]="form" >
      <div class="my-4">
        @if(pictureDefault){
          <img
            src="https://placehold.co/600x400/e9ecef/495057?text=Dog+%26+Cat+Classifier"
            alt="Placeholder"
            class="img-fluid rounded shadow-sm"
            [width]="200"
            [height]="200"
          />
        } @else {
          <img [src]="imageBytes"
               [width]="200"
               [height]="200"
               class="img-fluid rounded shadow-sm object-fit-cover"
               alt="byte profile"
          />
        }
      </div>
      <div class="row">
      <div class="col-8 mb-3" style="font-size: 30px">
        <span><h5>Select animal</h5></span>
      </div>
      <div class="col-10">
        <p-button
          severity="secondary"
          (onClick)="fileInput.click()"
        >

          <input
            #fileInput
            type="file"
            id="file"
            (change)="handleFileInput()"

          />
        </p-button>
      </div>
    </div>
    <div class="mt-3">
      <p-button
        label="Which animal is this"
        severity="primary"
        (onClick)="checkWhichAnimal()"

      />
    </div>

    <div class="row my-3">
      <div class="col-12 col-md-6">
        <p-floatlabel variant="in" style="width: 100%; display: block;">
          <input
            id="selectedAnimal"
            pInputText
            style="width: 100%; box-sizing: border-box;"
            formControlName="topPrediction"
          />
          <label for="selectedAnimal" class="font-semibold">The animal</label>
        </p-floatlabel>
      </div>
    </div>
    <!-- Set up a row with a 6-column span (6/12 = 50%) -->
    <div class="row my-3">
      <div class="col-12 col-md-6">
        <p-floatlabel variant="in" style="width: 100%; display: block;">
      <textarea
        id="allpredictions"
        pTextarea
        style="width: 100%; box-sizing: border-box;"
        formControlName="allPrediction"
        rows="6"
        placeholder="Type or view predictions...">
      </textarea>
          <label for="allpredictions" class="font-semibold">All predictions</label>
        </p-floatlabel>
      </div>
    </div>


  </form>
</div>
