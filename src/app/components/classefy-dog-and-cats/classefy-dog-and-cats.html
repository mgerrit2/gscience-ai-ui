<div class="m-lg-3">
  <p class="h2">Dog & Cat Classifier</p>
  <form [formGroup]="form" >
      <div class="my-4">
        @if(pictureDefault){
          <img
            src="https://placehold.co/600x400/e9ecef/495057?text=Dog+%26+Cat+Classifier"
            alt="Placeholder"
            class="img-fluid rounded shadow-sm"
            [width]="200"
            [height]="200"
          />
        } @else {
          <img [src]="imageBytes"
               [width]="200"
               [height]="200"
               class="profile-rect"
               alt="byte image profile"
          />
        }
      </div>
      <div class="row">
      <div class="col-8 mb-3" style="font-size: 30px">
        <span><h5>Select image to indentify animal</h5></span>
      </div>
      <div class="col-10">
        <p-button
          severity="secondary"
          (onClick)="fileInput.click()"
        >

          <input
            #fileInput
            type="file"
            id="file"
            (change)="handleFileInput()"

          />
        </p-button>
      </div>
    </div>
    <div class="mt-3">
      <p-button
        label="Which animal is this"
        severity="secondary"
        (onClick)="checkWhichAnimal()"

      />
    </div>

    <div class="my-3">
      <input pInputText class="w-full" formControlName="topPrediction"/>
    </div>


  </form>
</div>
