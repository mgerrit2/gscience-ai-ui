<div class="m-lg-3">
  <p class="h2">Dog & Cat Classifier</p>
  <form [formGroup]="form" >
      <div class="my-4">
        @if(pictureDefault){
          <img
            src="https://placehold.co/600x400/e9ecef/495057?text=Dog+%26+Cat+Classifier"
            alt="Placeholder"
            class="img-fluid rounded shadow-sm"
            [width]="200"
            [height]="200"
          />
        } @else {
          <img [src]="imageBytes"
               [width]="200"
               [height]="200"
               class="img-fluid rounded shadow-sm object-fit-cover"
               alt="byte profile"
          />
        }
      </div>
      <div class="row">
      <div class="col-10">
          <input
            #fileInput
            type="file"
            id="file"
            class="d-none"
            accept="image/*"
            (change)="handleFileInput($event)"

          />
        <p-button
          label="Select Animal Image"
          icon="pi pi-image"
          severity="secondary"
          (onClick)="fileInput.click()"
        >
        </p-button>
      </div>
    </div>


    <div class="row my-3">
      <div class="col-12 col-md-6">
        <p-floatlabel variant="in" style="width: 100%; display: block;">
          <input
            id="selectedAnimal"
            pInputText
            style="width: 100%; box-sizing: border-box;"
            formControlName="topPrediction"
          />
          <label for="selectedAnimal" class="font-semibold">The animal</label>
        </p-floatlabel>
      </div>
    </div>
    <!-- Set up a row with a 6-column span (6/12 = 50%) -->
    <div class="row my-3">
      <div class="col-12 col-md-6">
        <p-floatlabel variant="in" style="width: 100%; display: block;">
      <textarea
        id="allpredictions"
        pTextarea
        style="width: 100%; box-sizing: border-box;"
        formControlName="allPrediction"
        rows="6"
        placeholder="Type or view predictions...">
      </textarea>
          <label for="allpredictions" class="font-semibold">All predictions</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="row my-3">
      <div class="col-12 col-md-8 col-lg-6">
        <p-accordion>
          <p-accordion-panel value="0">
            <p-accordion-header>
              <div class="d-flex align-items-center gap-2">
                <i class="pi pi-cog text-primary fs-5"></i>
                <span class="fw-bold fs-6">Specifications</span>
              </div>
            </p-accordion-header>

            <p-accordion-content>
              <!-- Purpose Section -->
              <div class="mb-4">
                <h6 class="fw-bold text-secondary d-flex align-items-center gap-2 mb-2">
                  <i class="pi pi-bullseye text-primary"></i> Purpose
                </h6>
                <p class="text-body-secondary small mb-0 ps-4">
                  Learn to integrate and serve an existing machine learning model through a backend API.
                </p>
              </div>

              <hr class="text-border my-3" />

              <!-- Technology Stack Section -->
              <div>
                <h6 class="fw-bold text-secondary d-flex align-items-center gap-2 mb-3">
                  <i class="pi pi-layers text-primary"></i> Technology Stack
                </h6>

                <ul class="list-group list-group-flush">
                  <!-- Backend -->
                  <li class="list-group-item d-flex align-items-center justify-content-between px-0 py-2 border-0">
                <span class="text-muted small d-flex align-items-center gap-2">
                  <i class="pi pi-server text-secondary"></i> Backend
                </span>
                    <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1">
                  FastAPI
                </span>
                  </li>

                  <!-- Frontend -->
                  <li class="list-group-item d-flex align-items-center justify-content-between px-0 py-2 border-0">
                <span class="text-muted small d-flex align-items-center gap-2">
                  <i class="pi pi-desktop text-secondary"></i> Frontend
                </span>
                    <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-1">
                  Angular
                </span>
                  </li>

                  <!-- Model -->
                  <li class="list-group-item d-flex align-items-center justify-content-between px-0 py-2 border-0">
                <span class="text-muted small d-flex align-items-center gap-2">
                  <i class="pi pi-microchip text-secondary"></i> Model
                </span>
                    <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle rounded-pill px-3 py-1 fw-medium">
                  ResNet-101
                </span>
                  </li>
                </ul>
              </div>
            </p-accordion-content>
          </p-accordion-panel>
        </p-accordion>
      </div>
    </div>
  </form>
</div>
